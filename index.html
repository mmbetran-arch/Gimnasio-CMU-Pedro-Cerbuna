<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>GIMNASIO CMU PEDRO CERBUNA</title>
    <style>
        :root {
            --bg-color: #0b1a30;
            --card-bg: #162a45;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #ffffff;
            --text-secondary: #cbd5e1;
            --border-color: #1e3a60;
            --highlight: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .screen {
            display: none !important;
        }

        .screen.active {
            display: block !important;
        }

        #home-screen {
            text-align: center;
            padding-top: 15vh;
        }

        h1.title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .subtitle {
            color: #93c5fd;
            font-size: 1.1rem;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            background-color: var(--accent-color);
            color: #ffffff;
            border: 2px solid #60a5fa;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-start:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        /* ESTRUCTURA SIMÉTRICA DEL MENÚ */
        .workout-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .grid-row-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .grid-row-bottom {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 650px) {
            .grid-row-top,
            .grid-row-bottom {
                grid-template-columns: 1fr;
            }
        }

        .workout-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 35px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .workout-card:hover {
            border-color: #60a5fa;
            transform: translateY(-3px);
            background-color: #1c3558;
        }

        .workout-card h2 {
            font-size: 1.3rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .workout-card.abs-card {
            border-color: var(--highlight);
            background: linear-gradient(135deg, #162a45 0%, #1e3a60 100%);
        }

        .btn-back {
            background-color: #162a45;
            color: #ffffff;
            border: 1px solid #3b82f6;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-back:hover {
            background-color: #1e3a60;
        }

        .section-title {
            color: #93c5fd;
            font-size: 1.3rem;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .exercise-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .btn-clarification {
            background-color: #0b1a30;
            color: var(--highlight);
            border: 1px solid var(--highlight);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-clarification:hover {
            background-color: var(--highlight);
            color: #0b1a30;
        }

        .exercise-desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid #3b82f6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .info-group {
            margin-bottom: 15px;
            background-color: #0b1a30;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }

        .info-group.highlight-group {
            border-left-color: var(--highlight);
        }

        .info-title {
            font-weight: bold;
            color: #60a5fa;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-text {
            color: #cbd5e1;
            font-size: 0.95rem;
        }
    </style>
</head>

let currentWorkoutKey = "";

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('start-btn').addEventListener('click', function() {
        showScreen('menu-screen');
    });

    document.getElementById('back-btn').addEventListener('click', function() {
        showScreen('menu-screen');
    });

    document.querySelectorAll('.workout-card').forEach(card => {
        card.addEventListener('click', function() {
            const workoutKey = this.getAttribute('data-workout');
            if (workoutKey) {
                loadWorkout(workoutKey);
            }
        });
    });

    document.getElementById('close-modal-btn').addEventListener('click', function() {
        closeModal();
    });
});

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) {
        target.classList.add('active');
    }
    window.scrollTo(0, 0);
}

function loadWorkout(key) {
    currentWorkoutKey = key;
    const data = workoutsData[key];
    document.getElementById('workout-title').innerText = data.title;

    const warmupSec = document.getElementById('warmup-section');
    const cooldownSec = document.getElementById('cooldown-section');
    const mainTitle = document.getElementById('main-section-title');

    if (data.isAbs) {
        warmupSec.style.display = 'none';
        cooldownSec.style.display = 'none';
        mainTitle.innerText = "Circuito Intensivo de Abdominales";
    } else {
        warmupSec.style.display = 'block';
        cooldownSec.style.display = 'block';
        mainTitle.innerText = "2. Rutina Principal";

        document.getElementById('warmup-container').innerHTML = data.warmup.map(item => `
            <div class="exercise-card">
                <div class="exercise-name" style="color: #93c5fd;">${item.name}</div>
                <p class="exercise-desc" style="margin-top: 5px;">${item.desc}</p>
            </div>
        `).join('');

        document.getElementById('cooldown-container').innerHTML = data.cooldown.map(item => `
            <div class="exercise-card">
                <div class="exercise-name" style="color: #6ee7b7;">${item.name}</div>
                <p class="exercise-desc" style="margin-top: 5px;">${item.desc}</p>
            </div>
        `).join('');
    }

    document.getElementById('exercises-container').innerHTML = data.exercises.map((item, idx) => `
        <div class="exercise-card">
            <div class="exercise-header">
                <div class="exercise-name">${idx + 1}. ${item.name}</div>
                <button class="btn-clarification" onclick="openClarification(${idx})">Ver Aclaraciones & Variantes</button>
            </div>
            <p class="exercise-desc">${item.desc}</p>
        </div>
    `).join('');

    showScreen('workout-screen');
}

function openClarification(idx) {
    const exercise = workoutsData[currentWorkoutKey].exercises[idx];
    document.getElementById('modal-exercise-name').innerText = "Aclaraciones: " + exercise.name;
    
    document.getElementById('modal-clarification-body').innerHTML = `
        <div class="info-group">
            <div class="info-title">Músculos Implicados Principalmente:</div>
            <div class="info-text">${exercise.muscles || 'Toda la zona anatómica objetivo.'}</div>
        </div>

        <div class="info-group">
            <div class="info-title">Sustitutos y Variaciones Recomendadas:</div>
            <div class="info-text">${exercise.substitutes || 'Ejercicios con patrón de movimiento equivalente.'}</div>
        </div>

        <div class="info-group highlight-group">
            <div class="info-title" style="color: #fbbf24;">Beneficios Fuera del Gimnasio (Rendimiento Diario):</div>
            <div class="info-text">${exercise.outsideBenefits || 'Mejora de la fuerza funcional y prevención de lesiones.'}</div>
        </div>

        <div class="info-group">
            <div class="info-title">Consejo / Truco Técnico de Ejecución:</div>
            <div class="info-text">${exercise.tips || 'Mantén siempre una postura limpia antes que aumentar el peso.'}</div>
        </div>
    `;

    document.getElementById('clarification-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('clarification-modal').style.display = 'none';
}
</script>
